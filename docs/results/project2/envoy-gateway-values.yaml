# Envoy Gateway v1.10.0 values used on the desktop (R19).
# Base: envoyproxy/ai-gateway v1.2.1 manifests/envoy-gateway-values.yaml
# + examples/inference-pool/envoy-gateway-values-addon.yaml (backendResources only, deploy.type left default)
# + enableLua (EG v1.10.0 api/v1alpha1/envoygateway_types.go: "By default, Lua policies are disabled")
# + the Redis rate-limit backend the ttalkkak README already set.
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      type: Kubernetes
    extensionApis:
      enableEnvoyPatchPolicy: true
      enableBackend: true
      enableLua: true
    extensionManager:
      hooks:
        xdsTranslator:
          translation:
            listener: {includeAll: true}
            route: {includeAll: true}
            cluster: {includeAll: true}
            secret: {includeAll: true}
          post: [Translation, Cluster, Route]
      service:
        fqdn:
          hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
          port: 1063
      backendResources:
        - group: inference.networking.k8s.io
          kind: InferencePool
          version: v1
    rateLimit:
      backend:
        type: Redis
        redis:
          url: redis.ttalkkak.svc.cluster.local:6379
