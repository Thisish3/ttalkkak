<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서버 연결 - ttalkkak 콘솔</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="connect-wrap">
  <form class="card connect" id="form" autocomplete="off">
    <h1>서버에 연결</h1>
    <p>ttalkkak 서버 주소와 운영자 토큰을 입력하세요.</p>
    <div class="errbox" id="err" role="alert" hidden></div>
    <div class="warnbox" id="warn" role="status" hidden></div>
    <label class="field"><span>서버 주소</span>
      <input id="url" class="mono" type="url" required placeholder="http://100.64.0.1:8787" spellcheck="false"></label>
    <label class="field"><span>운영자 토큰</span>
      <input id="token" class="mono" type="password" required placeholder="ttk_op_..." spellcheck="false"></label>
    <label class="field" id="clear-row" hidden><span class="warnbox">▲ http:// 주소라서 토큰이 암호화되지 않은 채 네트워크로 전송됩니다. 내 컴퓨터, Tailscale(100.64.0.0/10, *.ts.net)이 아닌 주소에는 https:// 를 쓰세요.</span>
      <input id="clear-ok" type="checkbox"> 위험을 이해했고, 이 주소로 토큰을 보냅니다</label>
    <button class="btn primary" id="go" type="submit">연결</button>
    <p class="hint">토큰은 서버에서 <code>ttalkkak ops token show</code>로 확인합니다.</p>
  </form>
</div>
<script src="app.js"></script>
<script src="connect.js"></script>
</body>
</html>
