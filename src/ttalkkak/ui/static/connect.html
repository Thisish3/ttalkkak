<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서버 연결 - ttalkkak 콘솔</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="connect-wrap">
  <form class="card connect" id="form" autocomplete="off">
    <h1>서버에 연결</h1>
    <p>ttalkkak 서버 주소와 운영자 토큰을 입력하세요.</p>
    <div class="errbox" id="err" role="alert" hidden></div>
    <div class="warnbox" id="warn" role="status" hidden></div>
    <label class="field"><span>서버 주소</span>
      <input id="url" class="mono" type="url" required placeholder="http://100.64.0.1:8787" spellcheck="false"></label>
    <label class="field"><span>운영자 토큰</span>
      <input id="token" class="mono" type="password" required placeholder="ttk_op_..." spellcheck="false"></label>
    <button class="btn primary" id="go" type="submit">연결</button>
    <p class="hint">토큰은 서버에서 <code>ttalkkak console-token</code>으로 확인합니다.</p>
  </form>
</div>
<script src="app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const fail = (msg) => { $("err").textContent = "✕ " + msg; $("err").hidden = false; };
  if (!inApp) {
    fail("이 화면은 데스크탑 앱에서만 쓸 수 있습니다");
    $("go").disabled = true;
    return;
  }
  const saved = await loadConnection();
  if (saved) $("url").value = saved.url;
  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("err").hidden = true;
    $("warn").hidden = true;
    $("go").disabled = true;
    const url = $("url").value.trim();
    const token = $("token").value.trim();
    try {
      await pingServer(url, token);
      await tauri.invoke("save_connection", { url, token });
      const conn = await loadConnection();
      if (conn && conn.token_storage === "file") {
        $("warn").textContent = "▲ 키체인을 쓸 수 없어 토큰을 설정 파일(권한 0600)에 저장했습니다";
        $("warn").hidden = false;
        setTimeout(() => location.replace("index.html"), 2500);
      } else {
        location.replace("index.html");
      }
    } catch (e) {
      fail(String(e));
      $("go").disabled = false;
    }
  });
})();
</script>
</body>
</html>
